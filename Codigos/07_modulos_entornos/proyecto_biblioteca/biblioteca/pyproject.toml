[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fisica-uq-ejemplo"
version = "0.1.0"
description = "Ejemplo docente de una biblioteca de física instalable"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["Libreria", "Libreria.*"]
